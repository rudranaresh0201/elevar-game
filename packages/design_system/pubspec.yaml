name: design_system
description: Elevar's visual language — colours, type and the chunky arcade controls shared by every game and screen.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
