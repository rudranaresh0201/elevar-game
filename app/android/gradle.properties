# WSL here has ~3.5 GB of RAM (host has 7.4 GB total). The Flutter template ships
# -Xmx8G, which makes the JVM grow until the Linux OOM killer takes down the whole
# WSL session. These numbers are sized to fit, not to be fast.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx640m

# One thing at a time — parallel workers multiply peak memory.
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true

# Don't leave a daemon resident between builds eating half the RAM.
org.gradle.daemon=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
