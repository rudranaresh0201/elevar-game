<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced at build time by `flutter build web --base-href`. Leave it alone:
    serving from a subpath without setting it gives a blank page and no error.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Elevar Play — cricket, football, racing, archery, ping pong and fruit drop. Play, earn points, spend them on kicks.">
  <meta name="theme-color" content="#12161C">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">

  <!-- Shared as a link far more often than it is installed, so the preview
       card matters more than the manifest does. -->
  <meta property="og:title" content="Elevar Play">
  <meta property="og:description" content="Six arcade games. Play, earn points, spend them on kicks.">
  <meta property="og:type" content="website">

  <!-- iPhone: added to the home screen, this opens full screen with the
       status bar drawn over the app — which is why #app is inset below. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Elevar Play">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Elevar Play</title>
  <link rel="manifest" href="manifest.json">

  <style>
    @font-face {
      font-family: "Baloo 2";
      src: url("assets/packages/design_system/assets/fonts/Baloo2-ExtraBold.ttf") format("truetype");
      font-weight: 800;
      font-display: swap;
    }
    @font-face {
      font-family: "Fredoka";
      src: url("assets/packages/design_system/assets/fonts/Fredoka-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #12161C;
      overscroll-behavior: none;
      /* iOS: no text-selection loupe, no "Save image" callout on a long press,
         no grey flash on every tap. A game is held, not read. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    /* Flutter renders in here (see flutter_bootstrap.js). The insets are zero
       on Android and in a desktop browser, so this only moves anything on a
       phone with a notch, an island or a home indicator. */
    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      touch-action: none;
    }

    /* The engine takes a couple of seconds to come up on a mid-range phone.
       Without this, the first thing a shared link shows is a white page — and
       a white page reads as broken. */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #12161C;
      color: #FFFFFF;
      font-family: "Baloo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.18em;
      font-size: 15px;
      font-weight: 800;
      transition: opacity 0.35s ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .bar {
      width: 132px;
      height: 10px;
      border: 3px solid #000;
      border-radius: 6px;
      background: #1C2028;
      overflow: hidden;
    }
    #boot .bar span {
      display: block;
      height: 100%;
      width: 40%;
      background: #FF2B2B;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-110%); }
      100% { transform: translateX(260%); }
    }

    /* "Add to Home Screen", for iPhones only. Safari will not prompt for this
       itself the way Chrome on Android does, so without the sheet nobody finds
       it — and it is the difference between a web page and an app: full
       screen, its own icon, and storage Safari does not clear after a week
       away (which is where the points live). */
    #a2hs {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(6, 8, 11, 0.62);
      opacity: 0;
      transition: opacity 0.25s ease;
      font-family: "Fredoka", system-ui, -apple-system, sans-serif;
      font-weight: 600;
      color: #fff;
      -webkit-user-select: none;
      user-select: none;
    }
    #a2hs.shown { opacity: 1; }
    #a2hs .sheet {
      box-sizing: border-box;
      width: min(100% - 24px, 420px);
      margin-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      padding: 22px 20px 18px;
      background: #1C2028;
      border: 3px solid #000;
      border-radius: 22px;
      box-shadow: 0 6px 0 #000;
      transform: translateY(40px);
      transition: transform 0.35s cubic-bezier(.2, 1.4, .4, 1);
    }
    #a2hs.shown .sheet { transform: none; }
    #a2hs .icon {
      width: 64px;
      height: 64px;
      margin: -54px auto 10px;
      border: 3px solid #000;
      border-radius: 16px;
      background: #12161C url("icons/Icon-192.png") center / cover;
      box-shadow: 0 4px 0 #000;
    }
    #a2hs h2 {
      margin: 0 0 4px;
      text-align: center;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 800;
      font-size: 24px;
      line-height: 1.1;
    }
    #a2hs .lede {
      margin: 0 0 16px;
      text-align: center;
      color: #8A94A6;
      font-size: 14px;
      line-height: 1.35;
    }
    #a2hs ol {
      margin: 0 0 16px;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }
    #a2hs li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #12161C;
      border: 2px solid #000;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.3;
    }
    #a2hs .n {
      flex: none;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 2px solid #000;
      border-radius: 50%;
      background: #FFF200;
      color: #000;
      font-family: "Baloo 2", system-ui, sans-serif;
      font-weight: 800;
      font-size: 15px;
    }
    #a2hs li svg { flex: none; margin-left: auto; color: #4DA3FF; }
    #a2hs b { color: #fff; }
    #a2hs .hint { color: #8A94A6; font-size: 13px; }
    #a2hs button {
      display: block;
      width: 100%;
      padding: 12px;
      border: 3px solid #000;
      border-radius: 14px;
      background: #FF2B2B;
      box-shadow: 0 4px 0 #000;
      color: #fff;
      font: 800 18px/1 "Baloo 2", system-ui, sans-serif;
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    #a2hs button:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
    #a2hs .later {
      margin-top: 10px;
      background: none;
      border: 0;
      box-shadow: none;
      color: #8A94A6;
      font: 600 14px/1 "Fredoka", system-ui, sans-serif;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="boot">
    <div>ELEVAR PLAY</div>
    <div class="bar"><span></span></div>
  </div>

  <template id="a2hs-template">
    <div id="a2hs" role="dialog" aria-modal="true" aria-labelledby="a2hs-title">
      <div class="sheet">
        <div class="icon" aria-hidden="true"></div>
        <h2 id="a2hs-title">Make it an app</h2>
        <p class="lede">Full screen, its own icon, and your points stay saved.</p>
        <ol data-steps></ol>
        <button type="button" data-close>GOT IT</button>
        <button type="button" class="later" data-close>Maybe later</button>
      </div>
    </div>
  </template>

  <script>
    // Flutter fires this once the first frame is actually on screen.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) {
        boot.classList.add('gone');
        setTimeout(function () { boot.remove(); }, 400);
      }
      setTimeout(maybeOfferHomeScreen, 1200);
    });

    function maybeOfferHomeScreen() {
      var KEY = 'elevar.a2hs.dismissedAt';
      var ua = navigator.userAgent;
      var forced = /[?&]a2hs=1\b/.test(location.search);
      // iPadOS reports itself as a Mac; the touch points give it away.
      var ios = /iPhone|iPad|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var installed = navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      if (!forced && (!ios || installed)) return;

      try {
        var last = Number(localStorage.getItem(KEY) || 0);
        // Asked in the last three days: leave them alone.
        if (!forced && Date.now() - last < 3 * 24 * 3600 * 1000) return;
      } catch (e) { /* private mode: just ask */ }

      var share = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M6 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1"/></svg>';
      var plus = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>';

      // Instagram, Snapchat and friends open links in their own browser,
      // which has no Add to Home Screen at all. Say so instead of sending
      // someone hunting for a button that is not there.
      var inApp = /FBAN|FBAV|Instagram|Snapchat|Line\/|LinkedInApp|GSA\//.test(ua);
      var steps = inApp
        ? '<li><span class="n">1</span><span>Tap <b>•••</b> and <b>Open in Safari</b></span></li>' +
          '<li><span class="n">2</span><span>Then <b>Share</b> → <b>Add to Home Screen</b></span>' + plus + '</li>'
        : '<li><span class="n">1</span><span>Tap <b>Share</b><br><span class="hint">Bottom bar — or <b>•••</b> first</span></span>' + share + '</li>' +
          '<li><span class="n">2</span><span>Tap <b>Add to Home Screen</b><br><span class="hint">Scroll down the list if you don’t see it</span></span>' + plus + '</li>' +
          '<li><span class="n">3</span><span>Open <b>Elevar Play</b> from your home screen</span></li>';

      var node = document.getElementById('a2hs-template').content.firstElementChild.cloneNode(true);
      node.querySelector('[data-steps]').innerHTML = steps;
      document.body.appendChild(node);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { node.classList.add('shown'); });
      });

      function close() {
        try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
        node.classList.remove('shown');
        setTimeout(function () { node.remove(); }, 300);
      }
      node.querySelectorAll('[data-close]').forEach(function (b) {
        b.addEventListener('click', close);
      });
      node.addEventListener('click', function (e) { if (e.target === node) close(); });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
