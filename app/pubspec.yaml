name: elevar_play
description: Elevar Play — a casual game hub. Games run on the device; the app keeps score.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  design_system:
    path: ../packages/design_system
  game_core:
    path: ../packages/game_core
  game_pingpong:
    path: ../packages/game_pingpong
  pingpong_sim:
    path: ../packages/pingpong_sim
  game_racing:
    path: ../packages/game_racing
  racing_sim:
    path: ../packages/racing_sim
  game_cricket:
    path: ../packages/game_cricket
  cricket_sim:
    path: ../packages/cricket_sim
  # The local points ledger. Hand-written SQL rather than an ORM — see
  # `lib/data/points_repository.dart` for why.
  sqflite: ^2.4.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Runs the same SQLite the phone runs, in a desktop test process.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
