# Elevar Play — static web build, served from a DigitalOcean droplet.
#
# Install:
#   sudo cp elevar-play.conf /etc/nginx/sites-available/elevar-play
#   sudo ln -s /etc/nginx/sites-available/elevar-play /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d play.elevarsports.com
#
# certbot rewrites this file in place to add the TLS block. That is expected;
# do not re-copy this file over it afterwards without re-running certbot.

server {
    listen 80;
    listen [::]:80;
    server_name play.elevarsports.com;

    root /var/www/elevar-play;
    index index.html;

    # Flutter web is one page. Anything that is not a real file is still the
    # app, or the first refresh on a deep link gives a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The engine is ~7MB of wasm and ~2.3MB of JS before compression. Serving
    # it uncompressed over a phone connection is the difference between a link
    # people try and a link people close.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Hashed and versioned by the build, so they can be cached hard.
    location ~* \.(?:js|wasm|otf|ttf|woff2|png|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache these two: index.html points at everything else, and
    # version.json is how the service worker notices a new build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # sqflite's web worker runs the ledger. Same-origin, so no CORS header is
    # needed — but it must be served with the right type or the browser
    # refuses to start it.
    location = /sqflite_sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    types {
        application/wasm wasm;
    }

    # The APK, for anyone who would rather install it than play in a tab.
    location = /elevar-play.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="elevar-play.apk"';
    }

    client_max_body_size 64m;
}
